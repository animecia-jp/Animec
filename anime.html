<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アニメ一覧 | Anime Lively Review</title>
  <meta name="description" content="Anime Lively Reviewのアニメ作品一覧。日本語タイトル・英語タイトル・ジャンルからアニメを検索し、作品情報やレビューを確認できます。">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#070b14">

  <!-- Open Graph / OGP -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="アニメ一覧 | Anime Lively Review">
  <meta property="og:description" content="アニメ作品を日本語タイトル・英語タイトル・ジャンルから検索できます。">
  <meta property="og:site_name" content="Anime Lively Review">

  <!-- Dynamic JSON-LD Schema -->
  <script type="application/ld+json" id="item-list-schema">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "アニメ一覧 | Anime Lively Review",
    "description": "Anime Lively Reviewのアニメ作品一覧。"
  }
  </script>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #070b14;
      --card-bg: #111827;
      --panel-bg: #1f293d;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1f2937;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 11, 20, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
    }
    .logo i { color: var(--accent-color); font-style: normal; }

    /* Main Container */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .page-header { margin-bottom: 30px; }
    .page-header h1 { font-size: 32px; margin: 0 0 8px; }
    .page-header p { color: var(--text-muted); margin: 0; }

    /* Advertisement Section */
    .ad-section {
      display: none;
      margin: 25px 0 30px;
    }
    .ad-label {
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .ad-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .ad-box img {
      max-width: 100%;
      max-height: 200px;
      margin: 0 auto 12px;
      border-radius: 8px;
      object-fit: contain;
    }
    .ad-company { color: var(--accent-color); font-size: 12px; font-weight: bold; }
    .ad-title { font-size: 18px; font-weight: bold; margin: 5px 0; }
    .ad-description { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; }
    .ad-button {
      display: inline-block;
      background: var(--accent-color);
      color: #fff;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      transition: background 0.2s;
    }
    .ad-button:hover { background: var(--accent-hover); }

    /* Search Box */
    .search-box { margin: 30px 0 20px; }
    .search-label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
    .search-input-wrap { position: relative; }
    .search-box input {
      width: 100%;
      padding: 14px 45px 14px 15px;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--accent-color); }
    .search-clear {
      display: none;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      background: var(--panel-bg);
      color: var(--text-muted);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      line-height: 26px;
      padding: 0;
    }
    .search-help { margin-top: 8px; color: var(--text-muted); font-size: 13px; }
    .count { margin-bottom: 20px; color: var(--text-muted); font-size: 14px; }

    /* Anime Grid & Cards */
    #anime-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .anime-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .anime-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
    }
    .anime-card h2 { margin: 0 0 6px; font-size: 18px; line-height: 1.4; }
    .english-title { color: var(--text-muted); font-size: 13px; margin-bottom: 12px; }
    .genre-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .genre {
      background: var(--panel-bg);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    .description {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin: 0 0 15px;
    }
    .detail-link {
      color: var(--accent-color);
      font-weight: bold;
      font-size: 14px;
      margin-top: auto;
    }

    .status {
      grid-column: 1 / -1;
      padding: 50px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      text-align: center;
      color: var(--text-muted);
    }

    /* Footer */
    footer {
      margin-top: 70px;
      padding: 40px 20px;
      background: #03060d;
      border-top: 1px solid var(--border-color);
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">Anime <i>Lively</i></a>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <section class="page-header">
      <h1>アニメ一覧</h1>
      <p>登録されているアニメ作品を探索・検索できます。</p>
    </section>

    <!-- ADVERTISEMENT -->
    <section id="ad-section" class="ad-section" aria-label="広告">
      <div class="ad-label">ADVERTISEMENT</div>
      <div id="ad-container" class="ad-box"></div>
    </section>

    <!-- SEARCH -->
    <div class="search-box">
      <label class="search-label" for="search">アニメを検索</label>
      <div class="search-input-wrap">
        <input type="search" id="search" placeholder="作品名・英語名・ジャンルを検索..." autocomplete="off" aria-label="アニメを検索">
        <button type="button" id="search-clear" class="search-clear" aria-label="検索をクリア">×</button>
      </div>
      <div class="search-help">日本語タイトル・英語タイトル・ジャンル・作品説明から検索できます。</div>
    </div>

    <div id="count" class="count" aria-live="polite">読み込み中……</div>

    <div id="anime-list" aria-live="polite">
      <div class="status">アニメ情報を読み込んでいます……</div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <b style="color: var(--text-main); font-size: 16px;">Anime Lively Review</b>
      <p style="margin-top: 5px;">アニメをもっと深く、もっと面白く。</p>
    </div>
  </footer>

  <script>
    /* Supabase Setup */
    const SUPABASE_URL = "https://bhgdjuwlxvbaeraaivmh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let animeData = [];

    /* Utilities */
    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text ?? "";
      return div.innerHTML;
    }

    function normalizeText(text) {
      return String(text ?? "").normalize("NFKC").toLocaleLowerCase("ja-JP").trim().replace(/\s+/g, " ");
    }

    function getSafeURL(url) {
      if (!url) return "";
      try {
        const parsed = new URL(url, window.location.origin);
        return (parsed.protocol === "https:" || parsed.protocol === "http:") ? parsed.href : "";
      } catch {
        return "";
      }
    }

    function getGenres(genre) {
      if (!genre) return [];
      return String(genre).split(/[,、/・|]/).map(item => item.trim()).filter(Boolean);
    }

    /* Render Anime Cards */
    function createAnimeCard(anime) {
      const card = document.createElement("a");
      card.className = "anime-card";
      card.href = `anime-detail.html?id=${encodeURIComponent(anime.id)}`;

      const title = escapeHTML(anime.title);
      const englishTitle = escapeHTML(anime.english_title);
      const description = escapeHTML(anime.description);
      const genres = getGenres(anime.genre);

      let genresHTML = genres.length ? `
        <div class="genre-list">
          ${genres.map(g => `<span class="genre">${escapeHTML(g)}</span>`).join("")}
        </div>
      ` : "";

      card.innerHTML = `
        <div>
          <h2>${title}</h2>
          ${englishTitle ? `<div class="english-title">${englishTitle}</div>` : ""}
          ${genresHTML}
          ${description ? `<p class="description">${description}</p>` : ""}
        </div>
        <div class="detail-link">詳細を見る →</div>
      `;

      return card;
    }

    function renderAnime(list) {
      const container = document.getElementById("anime-list");
      const count = document.getElementById("count");

      count.textContent = `${list.length}作品表示中`;
      container.innerHTML = "";

      if (!list.length) {
        container.innerHTML = `<div class="status">該当する作品が見つかりませんでした。</div>`;
        updateStructuredData([]);
        return;
      }

      const fragment = document.createDocumentFragment();
      list.forEach(anime => fragment.appendChild(createAnimeCard(anime)));
      container.appendChild(fragment);

      updateStructuredData(list);
    }

    /* Structured Data (JSON-LD) */
    function updateStructuredData(list) {
      const schemaElement = document.getElementById("item-list-schema");
      if (!schemaElement) return;

      const items = list.map((anime, index) => ({
        "@type": "ListItem",
        "position": index + 1,
        "name": anime.title || "",
        "url": `${window.location.origin}/anime-detail.html?id=${encodeURIComponent(anime.id)}`
      }));

      schemaElement.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Anime Lively Review アニメ一覧",
        "itemListElement": items
      });
    }

    /* Fetch Data */
    async function loadAnime() {
      const container = document.getElementById("anime-list");
      const count = document.getElementById("count");

      try {
        const { data, error } = await supabaseClient
          .from("anime")
          .select("id,title,english_title,genre,description,review,official_url")
          .order("id", { ascending: true });

        if (error) throw error;

        animeData = Array.isArray(data) ? data : [];
        renderAnime(animeData);

      } catch (error) {
        console.error("アニメ取得エラー:", error);
        count.textContent = "読み込みエラー";
        container.innerHTML = `<div class="status">アニメ情報を取得できませんでした。<br>時間をおいて再度お試しください。</div>`;
      }
    }

    /* Search Scoring Logic */
    function getSearchScore(anime, keyword) {
      const title = normalizeText(anime.title);
      const english = normalizeText(anime.english_title);
      const genre = normalizeText(anime.genre);
      const description = normalizeText(anime.description);

      if (title === keyword) return 1000;
      if (english === keyword) return 950;
      if (genre === keyword) return 900;
      if (title.startsWith(keyword)) return 850;
      if (english.startsWith(keyword)) return 800;
      if (genre.startsWith(keyword)) return 700;
      if (title.includes(keyword)) return 600;
      if (english.includes(keyword)) return 550;
      if (genre.includes(keyword)) return 400;
      if (description.includes(keyword)) return 200;

      return 0;
    }

    function searchAnime(keyword) {
      const normalizedKeyword = normalizeText(keyword);
      if (!normalizedKeyword) {
        renderAnime(animeData);
        return;
      }

      const filtered = animeData
        .map(anime => ({ anime, score: getSearchScore(anime, normalizedKeyword) }))
        .filter(item => item.score > 0)
        .sort((a, b) => b.score !== a.score ? b.score - a.score : normalizeText(a.anime.title).localeCompare(normalizeText(b.anime.title), "ja"))
        .map(item => item.anime);

      renderAnime(filtered);
    }

    /* Event Listeners */
    const searchInput = document.getElementById("search");
    const searchClear = document.getElementById("search-clear");

    searchInput.addEventListener("input", function () {
      searchAnime(this.value);
      searchClear.style.display = this.value ? "block" : "none";
    });

    searchClear.addEventListener("click", function () {
      searchInput.value = "";
      searchAnime("");
      this.style.display = "none";
      searchInput.focus();
    });

    /* Advertisement Fetch */
    async function loadAdvertisement() {
      const section = document.getElementById("ad-section");
      const container = document.getElementById("ad-container");

      try {
        const { data, error } = await supabaseClient
          .from("advertisements")
          .select("id,company_name,title,description,image_url,link_url")
          .eq("is_active", true)
          .order("id", { ascending: true })
          .limit(1);

        if (error || !data || data.length === 0) {
          section.style.display = "none";
          return;
        }

        const ad = data[0];
        let html = "";

        if (ad.image_url) {
          const imageURL = getSafeURL(ad.image_url);
          if (imageURL) {
            html += `<img src="${escapeHTML(imageURL)}" alt="${escapeHTML(ad.title || '広告')}" loading="lazy" onerror="this.remove();">`;
          }
        }

        if (ad.company_name) html += `<div class="ad-company">${escapeHTML(ad.company_name)}</div>`;
        if (ad.title) html += `<div class="ad-title">${escapeHTML(ad.title)}</div>`;
        if (ad.description) html += `<div class="ad-description">${escapeHTML(ad.description)}</div>`;

        const safeLink = getSafeURL(ad.link_url);
        if (safeLink) {
          html += `<a class="ad-button" href="${escapeHTML(safeLink)}" target="_blank" rel="noopener noreferrer nofollow">詳しくはこちら</a>`;
        }

        if (!html.trim()) {
          section.style.display = "none";
          return;
        }

        container.innerHTML = html;
        section.style.display = "block";

      } catch (error) {
        console.error("広告取得エラー:", error);
        section.style.display = "none";
      }
    }

    /* Initialize */
    document.addEventListener("DOMContentLoaded", () => {
      loadAnime();
      loadAdvertisement();
    });
  </script>
</body>
</html>
